services:
  catalog:
    build: ./catalog
    ports:
      - "6543:5000"
    volumes:
      - ./catalog:/root/app

  shop-front:
    build: ./shop-front-service
    ports:
      - "6544:5000"
    volumes:
      - ./shop-front-service:/root/app

  product-admin:
    build: ./product-admin-service
    ports:
      - "6545:5000"
    volumes:
      - ./product-admin-service:/root/app

  gateway:
    image: nginx:latest
    ports:
      - "85:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog
      - shop-front
      - product-admin