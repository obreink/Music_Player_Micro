user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;
events {
 worker_connections 1024;
}
http {
 include /etc/nginx/mime.types;
 server {
 listen 80;
 server_name localhost;
 # home page: show the product list
 location = / {
 proxy_pass http://shop-front:5000/get-catalog;
 }
 # product list -> shop-front service
 location /get-catalog {
 proxy_pass http://shop-front:5000/get-catalog;
 }
 # add product form -> product-admin service
 location /add-product-page {
 proxy_pass http://product-admin:5000/add-product-page;
 }
 # submitted form -> product-admin service
 location /add-product {
 proxy_pass http://product-admin:5000/add-product;
 }
 error_page 500 502 503 504 /50x.html;
 location = /50x.html {
 root /usr/share/nginx/html;
 }
 }
}